plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'de.fabelbattler.app'
    compileSdk 35

    // Fester Signatur-Key: GitHub-Runners erzeugen sonst bei jedem Lauf ein
    // neues Debug-Zertifikat, wodurch ein Update der installierten App mit
    // "signatures do not match" abbricht. Diese p12 liegt im Repo und wird
    // fuer alle Builds wiederverwendet.
    signingConfigs {
        debug {
            storeFile file('debug.p12')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'de.fabelbattler.app'
        minSdk 24
        targetSdk 35
        versionCode project.property('APP_VERSION_CODE').toInteger()
        versionName project.property('APP_VERSION_NAME')
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
