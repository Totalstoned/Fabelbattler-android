name: Build Fabelbattler APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(printf '%s\n' "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Read app version
        id: version
        run: |
          VERSION_NAME="$(python3 -c "import re; print(re.search(r'^APP_VERSION_NAME=(.*)$', open('gradle.properties', encoding='utf-8').read(), re.M).group(1).strip())")"
          VERSION_CODE="$(python3 -c "import re; print(re.search(r'^APP_VERSION_CODE=(.*)$', open('gradle.properties', encoding='utf-8').read(), re.M).group(1).strip())")"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk=fabelbattler-v${VERSION_NAME}-b${VERSION_CODE}.apk" >> "$GITHUB_OUTPUT"

      - name: Validate JS, game data and runtime
        run: |
          python3 scripts/check_js.py app/src/main/assets/index3d.html
          python3 scripts/check_data.py app/src/main/assets/index3d.html
          node scripts/check_runtime.js app/src/main/assets/index3d.html
          grep -q 'android:screenOrientation="landscape"' app/src/main/AndroidManifest.xml

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "${{ steps.version.outputs.apk }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk }}
          path: ${{ steps.version.outputs.apk }}
          if-no-files-found: error
