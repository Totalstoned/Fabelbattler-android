name: Fabelbattler Autonomous Agent

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: fabelbattler-autonomous
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "opencode[bot]"
          git config user.email "opencode[bot]@users.noreply.github.com"

      - name: Verify API key
        id: api_key
        run: |
          if [ -n "$OPENCODE_API_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run OpenCode agent
        if: steps.api_key.outputs.ok == 'true'
        uses: anomalyco/opencode/github@latest
        with:
          model: openai/gpt-4o-mini
          use_github_token: true
          prompt: |
            Du arbeitest autonom an Fabelbattler in diesem Repository.

            Lies zuerst Issue #${{ vars.FABEL_PROGRESS_ISSUE }} und wähle mindestens zwei offene, kleine Ziele aus der Checkliste. Falls nicht genug sinnvolle Ziele offen sind, ergänze kleine, eigene Verbesserungen mit klarem Nutzen für die App.

            Aktueller Stand:
            - Aktive App ist die Three.js-WebView-Version in app/src/main/assets/index3d.html.
            - 123 Einheiten, 10 Klassen, 7 Rassen (inkl. Kryptozoologie), 51 Zauber sind bereits enthalten.
            - Team-Buffs skalieren nach Anzahl: gleiche Klassen/Rassen und die gesamte Duden-Zahl stärken das Team.
            - Grafik hat bereits Schatten, Glow, Partikel, HP-/Schildbalken und Kamera-Zoom.
            - UE5-Daten und C++-Gerüst liegen außerhalb dieses Repos nur als spätere Option.
            - Referenz-APK `How-Many-Dudes-v100.1.35-full-apkvision.apk`: vor jedem Lauf `python3 scripts/reference_apk.py` ausführen; docs/REFERENCE_APK.md und docs/ASSET_BEDARF.md lesen. Mindestens ZWEI Mechaniken daraus im selben Arbeitszyklus auf UNSERE Einheiten und unser 18x14-Feld übertragen – keine Grafiken, Texte oder Namen der Referenz kopieren.

            Regeln:
            - Der Workflow läuft alle 10 Minuten; bleibe daher strikt unter 9 Minuten und wähle wirklich nur kleine Ziele, die gemeinsam in diese Zeit passen.
            - Pro Arbeitszyklus mindestens zwei abgeschlossene, kleine Ziele (mehr als eine Aufgabe pro Lauf).
            - HARTE REGEL: Das Interface darf WEDER kleiner noch größer werden. Keine Änderung an font-size, padding, max-width oder transform:scale von HUD/Buttons/Dialogen, keine neuen vw/vh-Regeln für das HUD; neue Grafiken in vorhandene Flächen einpassen. Der 3D-Kamera-Zoom bleibt unangetastet.
            - Keine Engine-Installation, keine großen Dependency-Neuerungen, keine Secrets oder Tokens in Dateien.
            - Kein Wechsel der Engine; Three.js/WebView bleibt der aktive Pfad.
            - Ändere bevorzugt app/src/main/assets/index3d.html und bei Bedarf vorhandene Repo-Dateien.
            - Bei jeder App-Änderung `python3 scripts/bump_version.py` ausführen (1.20.1 -> 1.20.2 -> 1.20.3 ... 1.99.9, VersionCode = major*1000+minor*10+patch). Nicht manuell zählen.
            - Validiere nach Änderungen mit: python3 scripts/check_js.py app/src/main/assets/index3d.html, python3 scripts/check_data.py app/src/main/assets/index3d.html und node scripts/check_runtime.js app/src/main/assets/index3d.html
            - Erstelle einen Commit und einen Pull Request mit kurzer, konkreter Beschreibung. Der lokale 10-Minuten-Loop integriert CLEAN-PRs automatisch nach erneuter Validierung.
            - Falls die Änderung nicht sicher abgeschlossen werden kann, ändere nichts und erkläre den Grund im Issue-Kommentar.

            Am Ende sollt du auf jeden Fall einen kurzen Issue-Kommentar mit dem gewählten Ziel, dem Ergebnis und dem nächsten Schritt schreiben.

      - name: Comment progress
        if: always()
        env:
          ISSUE_NUMBER: ${{ vars.FABEL_PROGRESS_ISSUE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KEY_OK: ${{ steps.api_key.outputs.ok }}
          RUN_STATUS: ${{ job.status }}
        run: |
          if [ -z "$ISSUE_NUMBER" ]; then
            exit 0
          fi
          {
            echo "### Fabelbattler background run"
            echo
            echo "- Status: $RUN_STATUS"
            echo "- Zeit: $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "- Run: $RUN_URL"
            echo "- Commit: $GITHUB_SHA"
            echo "- Model key: $KEY_OK"
            if [ "$KEY_OK" != "true" ]; then
              echo
              echo "Blockiert: GitHub Secret OPENCODE_API_KEY fehlt."
            fi
            echo
            echo "Der Agent wählt das nächste offene Ziel aus dem Fortschritts-Issue. Änderungen erscheinen als PR."
          } > /tmp/fabelbattler-progress.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/fabelbattler-progress.md
